<canvas id="world"></canvas><canvas id="clouds"></canvas>
<div class="topbar"><div class="chip"><i></i><span id="realm">ARCADIA</span></div><div class="chip">Era <b id="era">Stone Age</b></div></div>
<div class="stats"><div class="year" id="year">Year 1</div><div class="pop" id="pop">Population: 18</div></div>
<button class="pause" id="pause">Ⅱ</button><button class="speed" id="speed">1×</button>

<div class="toolbar">
<button class="tool active" data-tool="inspect" data-tip="Inspect">🔎<small>Inspect</small></button><button class="tool" data-tool="grass" data-tip="Plains">🌿<small>Grass</small></button><button class="tool" data-tool="forest" data-tip="Forest">🌲<small>Forest</small></button><button class="tool" data-tool="mountain" data-tip="Raise mountain">⛰️<small>Mountain</small></button><button class="tool" data-tool="water" data-tip="Create water">💧<small>Water</small></button><button class="tool" data-tool="sand" data-tip="Create beach">🏖️<small>Sand</small></button><button class="tool" data-tool="house" data-tip="Village house">🏠<small>House</small></button><button class="tool" data-tool="human" data-tip="Spawn human">🧍<small>Human</small></button><button class="tool" data-tool="sheep" data-tip="Spawn sheep">🐑<small>Sheep</small></button><button class="tool" data-tool="rain" data-tip="Rain storm">🌧️<small>Rain</small></button><button class="tool" data-tool="fire" data-tip="Divine fire">🔥<small>Fire</small></button><button class="tool" data-tool="lightning" data-tip="Lightning">⚡<small>Lightning</small></button><button class="tool" data-tool="erase" data-tip="Erase life">🗑️<small>Erase</small></button>

<script>
const c=document.getElementById('world'),ctx=c.getContext('2d'),cloud=document.getElementById('clouds'),cx=cloud.getContext('2d'),mini=document.getElementById('mini'),mx=mini.getContext('2d');let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;for(const x of [c,cloud]){x.width=W*DPR;x.height=H*DPR;x.style.width=W+'px';x.style.height=H+'px'}ctx.setTransform(DPR,0,0,DPR,0,0);cx.setTransform(DPR,0,0,DPR,0,0);mini.width=276;mini.height=276}addEventListener('resize',resize);resize();
const N=64,TS=18;let map=[],tool='inspect',paused=false,speed=1,year=1,camera={x:0,y:0,zoom:.48},rain=[],lightning=[],creatures=[],particles=[],clouds=[],simClock=0,lastPaint='';
function noise(x,z){return Math.sin(x*.19)*.6+Math.sin(z*.17)*.5+Math.sin((x+z)*.11)*.8+Math.sin(Math.hypot(x-32,z-32)*.24)*.7}
for(let x=0;x<N;x++){map[x]=[];for(let z=0;z<N;z++){let island=1-Math.hypot((x-31.5)/38,(z-31.5)/38);let n=noise(x,z);let h=Math.floor(1+island*5+n*1.25);h=Math.max(-2,Math.min(8,h));let biome=h<=0?'water':h<=1?'sand':h>=7?'mountain':'grass';map[x][z]={h,biome,tree:biome==='grass'&&Math.random()<.065,house:false,fire:0,wet:0}}}
for(let i=0;i<18;i++){let x=24+Math.floor(Math.random()*16),z=24+Math.floor(Math.random()*16),t=map[x][z];if(t.h>1&&t.biome==='grass'){creatures.push({x:x+.5,z:z+.5,tx:x+.5,tz:z+.5,kind:i<14?'human':'sheep',phase:Math.random()*6,age:0,health:100,hunger:40,name:['Aro','Bala','Milo','Iva','Toru','Sela','Yona','Oro'][i%8]})}}
let villageSite=null,bestScore=Infinity;for(let x=22;x<42;x++)for(let z=22;z<42;z++){let score=Math.abs(x-32)+Math.abs(z-32),clear=true;for(let dx=-2;dx<=2;dx++)for(let dz=-2;dz<=2;dz++)if(map[x+dx]?.[z+dz]?.biome!=='grass')clear=false;if(clear&&score<bestScore){bestScore=score;villageSite={x,z}}}if(villageSite){for(let [dx,dz] of [[-1,-1],[1,-1],[-1,1],[1,1]]){let t=map[villageSite.x+dx][villageSite.z+dz];t.house=true;t.tree=false}for(let a of creatures.filter(v=>v.kind==='human')){a.tx=villageSite.x+.5;a.tz=villageSite.z+.5}}for(let i=0;i<12;i++)clouds.push({x:Math.random()*W,y:30+Math.random()*220,s:.7+Math.random()*1.1});
function proj(x,z,h){let cx=W*.5+camera.x,cy=H*.5+camera.y;return{sX:cx+(x-z)*TS*.95*camera.zoom,sY:cy+(x+z-N)*TS*.48*camera.zoom-h*10*camera.zoom}}
function worldPos(mx,my){let cx=W*.5+camera.x,cy=H*.5+camera.y,u=(mx-cx)/(TS*.95*camera.zoom),v=(my-cy)/(TS*.48*camera.zoom)+N;return{x:Math.floor((u+v)/2),z:Math.floor((v-u)/2)}}
function poly(a,b,d,e,color,stroke){ctx.beginPath();ctx.moveTo(a.sX,a.sY);ctx.lineTo(b.sX,b.sY);ctx.lineTo(d.sX,d.sY);ctx.lineTo(e.sX,e.sY);ctx.closePath();ctx.fillStyle=color;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=.55;ctx.stroke()}}
function diamond(x,z,h,top,left,right,outline){let p=proj(x,z,h),a=proj(x+1,z,h),b=proj(x+1,z+1,h),d=proj(x,z+1,h);poly(p,a,b,d,top,outline);if(left){let pb=proj(x,z+1,h),pbh=proj(x,z+1,h-1),bb=proj(x+1,z+1,h),bbh=proj(x+1,z+1,h-1);poly(pb,pbh,bbh,bb,left,'#00000012')}if(right){let aa=proj(x+1,z,h),aah=proj(x+1,z,h-1),bb=proj(x+1,z+1,h),bbh=proj(x+1,z+1,h-1);poly(aah,bbh,bb,aa,right,'#00000012')}}
function drawTree(x,z,h){let p=proj(x+.5,z+.5,h);ctx.fillStyle='#654630';ctx.fillRect(p.sX-2,p.sY-15,4,15);ctx.fillStyle='#275e32';ctx.beginPath();ctx.arc(p.sX,p.sY-20,9,0,7);ctx.fill();ctx.fillStyle='#3e873e';ctx.beginPath();ctx.arc(p.sX-5,p.sY-24,7,0,7);ctx.arc(p.sX+6,p.sY-23,7,0,7);ctx.fill();ctx.fillStyle='#67a64e';ctx.beginPath();ctx.arc(p.sX,p.sY-30,6,0,7);ctx.fill()}
function drawPine(x,z,h){let p=proj(x+.5,z+.5,h);ctx.fillStyle='#60452f';ctx.fillRect(p.sX-2,p.sY-16,4,16);ctx.fillStyle='#215b43';ctx.beginPath();ctx.moveTo(p.sX,p.sY-38);ctx.lineTo(p.sX-11,p.sY-9);ctx.lineTo(p.sX+11,p.sY-9);ctx.fill();ctx.fillStyle='#34795a';ctx.beginPath();ctx.moveTo(p.sX,p.sY-31);ctx.lineTo(p.sX-8,p.sY-5);ctx.lineTo(p.sX+8,p.sY-5);ctx.fill()}
function drawHouse(x,z,h){let p=proj(x+.5,z+.5,h);ctx.fillStyle='#987353';ctx.fillRect(p.sX-12,p.sY-23,24,23);ctx.fillStyle='#b99a65';ctx.fillRect(p.sX-8,p.sY-17,6,7);ctx.fillStyle='#50382b';ctx.fillRect(p.sX+3,p.sY-10,6,10);ctx.fillStyle='#7a4436';ctx.beginPath();ctx.moveTo(p.sX-16,p.sY-23);ctx.lineTo(p.sX,p.sY-39);ctx.lineTo(p.sX+16,p.sY-23);ctx.fill();ctx.fillStyle='#e3c35f';ctx.fillRect(p.sX-6,p.sY-15,3,3)}
function drawFire(x,z,h){let p=proj(x+.5,z+.5,h),n=performance.now()/100;ctx.fillStyle='#c73a24';ctx.beginPath();ctx.moveTo(p.sX,p.sY-27-Math.sin(n)*3);ctx.quadraticCurveTo(p.sX-12,p.sY-10,p.sX-7,p.sY);ctx.quadraticCurveTo(p.sX,p.sY-4,p.sX+7,p.sY);ctx.quadraticCurveTo(p.sX+12,p.sY-10,p.sX,p.sY-27);ctx.fill();ctx.fillStyle='#ffb21f';ctx.beginPath();ctx.moveTo(p.sX,p.sY-20);ctx.quadraticCurveTo(p.sX-7,p.sY-8,p.sX,p.sY);ctx.quadraticCurveTo(p.sX+7,p.sY-8,p.sX,p.sY-20);ctx.fill()}
function drawCreature(a){let t=map[Math.floor(a.x)]?.[Math.floor(a.z)],h=t?t.h:1,p=proj(a.x+.5,a.z+.5,h);if(a.kind==='sheep'){ctx.fillStyle='#ece9d7';ctx.beginPath();ctx.ellipse(p.sX,p.sY-9,8,6,-.1,0,7);ctx.fill();ctx.fillStyle='#4b4238';ctx.beginPath();ctx.arc(p.sX+7,p.sY-10,3.5,0,7);ctx.fill();ctx.fillStyle='#6b5a43';ctx.fillRect(p.sX-5,p.sY-4,2,5);ctx.fillRect(p.sX+4,p.sY-4,2,5)}else{let shirt=['#579678','#b45e45','#4c7d9c','#d08a48'][Math.floor(a.age)%4];ctx.fillStyle=shirt;ctx.fillRect(p.sX-4,p.sY-20,8,14);ctx.fillStyle='#c9956b';ctx.fillRect(p.sX-4,p.sY-28,8,8);ctx.fillStyle='#49342a';ctx.fillRect(p.sX-5,p.sY-29,10,3);ctx.fillStyle='#3b3027';ctx.fillRect(p.sX-3,p.sY-6,3,7);ctx.fillRect(p.sX+1,p.sY-6,3,7);ctx.fillStyle='#fff';ctx.fillRect(p.sX-3,p.sY-26,2,1);ctx.fillRect(p.sX+1,p.sY-26,2,1)}}
function draw(){ctx.clearRect(0,0,W,H);let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#78b3d8');sky.addColorStop(.58,'#b7d9ec');sky.addColorStop(1,'#d9e5cf');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);let sun=ctx.createRadialGradient(W*.82,H*.15,5,W*.82,H*.15,70);sun.addColorStop(0,'#fffbd2');sun.addColorStop(.3,'#ffe69baa');sun.addColorStop(1,'#fff0a000');ctx.fillStyle=sun;ctx.fillRect(W*.72,H*.05,W*.2,H*.25);
if(!paused){year+=.0009*speed;for(let c of clouds)c.x+=.08*speed;if(clouds[0].x>W+100)clouds.forEach(c=>c.x-=W+200)}cx.clearRect(0,0,W,H);for(let c of clouds){cx.fillStyle='#ffffffbf';cx.beginPath();cx.ellipse(c.x,c.y,45*c.s,13*c.s,0,0,7);cx.ellipse(c.x-28*c.s,c.y+4*c.s,25*c.s,9*c.s,0,0,7);cx.ellipse(c.x+32*c.s,c.y+5*c.s,24*c.s,8*c.s,0,0,7);cx.fill()}
let tiles=[];for(let s=0;s<N*2;s++)for(let x=0;x<N;x++){let z=s-x;if(z>=0&&z<N)tiles.push([x,z])}tiles.sort((a,b)=>(a[0]+a[1])-(b[0]+b[1])).forEach(v=>{let x=v[0],z=v[1],t=map[x][z],shade=((x*17+z*31)%9)-4;let top=t.biome==='water'?`hsl(202,60%,${48-Math.sin(performance.now()/700+x*.3)*3}%)`:t.biome==='sand'?'#dcc890':t.biome==='mountain'?`hsl(145,3%,${57+shade}%)`:`hsl(${96+shade},${38+shade}%,${46+shade}%)`;let left=t.biome==='mountain'?'#676f6d':t.biome==='sand'?'#b89e62':t.biome==='water'?'#397ba1':'#557f3d';let right=t.biome==='mountain'?'#777f7b':t.biome==='sand'?'#cab777':t.biome==='water'?'#4b91b5':'#669344';diamond(x,z,t.h,top,left,right,'#00000012');if(t.biome==='grass'&&!t.tree&&!t.house&&((x*13+z*7)%29===0)){let p=proj(x+.5,z+.5,t.h);ctx.fillStyle=((x+z)%2)?'#f2dc78':'#f1f0ce';ctx.beginPath();ctx.arc(p.sX,p.sY-2,1.3,0,7);ctx.fill()}if(t.tree)t.biome==='grass'?drawTree(x,z,t.h):drawPine(x,z,t.h);if(t.house)drawHouse(x,z,t.h);if(t.fire>0)drawFire(x,z,t.h)});
if(!paused){simClock+=speed;if(simClock>=30){simClock=0;for(let x=0;x<N;x++)for(let z=0;z<N;z++){let t=map[x][z];if(t.fire>0){t.fire=Math.max(0,t.fire-(rain.length?3:1));if(t.fire>0&&Math.random()<.012){for(let dx=-1;dx<=1;dx++)for(let dz=-1;dz<=1;dz++){let n=map[x+dx]?.[z+dz];if(n&&(n.tree||n.house)&&n.fire===0&&Math.random()<.22)n.fire=80}}}}for(let a of creatures){let x=Math.floor(a.x),z=Math.floor(a.z),t=map[x]?.[z];a.hunger=Math.min(100,(a.hunger||0)+(a.kind==='human'?1:.45));if(a.kind==='sheep'&&t?.biome==='grass')a.hunger=Math.max(0,a.hunger-2);if(a.kind==='human'&&map.slice(Math.max(0,x-2),Math.min(N,x+3)).some(col=>col.slice(Math.max(0,z-2),Math.min(N,z+3)).some(v=>v.house)))a.hunger=Math.max(0,a.hunger-4);if(a.hunger>82)a.health-=3; if(t?.fire>0)a.health-=12}creatures=creatures.filter(a=>a.health>0);let humans=creatures.filter(a=>a.kind==='human');if(humans.length>=2&&humans.length<48&&Math.random()<.035){let parent=humans[Math.floor(Math.random()*humans.length)],x=Math.floor(parent.x),z=Math.floor(parent.z);if(map[x]?.[z]?.biome==='grass'&&map[x][z].fire===0)creatures.push({x:x+.5,z:z+.5,tx:x+.5,tz:z+.5,kind:'human',phase:0,age:0,health:100,hunger:20,name:['Aro','Bala','Milo','Iva','Toru','Sela','Yona','Oro'][Math.floor(Math.random()*8)]})}}creatures.forEach(a=>{if(Math.random()<.006*speed){a.tx=Math.max(2,Math.min(N-3,a.x+(Math.random()*2-1)*5));a.tz=Math.max(2,Math.min(N-3,a.z+(Math.random()*2-1)*5))}a.x+=(a.tx-a.x)*.012*speed;a.z+=(a.tz-a.z)*.012*speed;a.age+=.01*speed;drawCreature(a)});
for(let r of rain){if(!paused){r.y+=5*speed;r.x-=2*speed;r.life-=speed}}rain=rain.filter(r=>r.life>0&&r.y<H+30);ctx.strokeStyle='#dbeeffae';ctx.lineWidth=1;rain.forEach(r=>{ctx.beginPath();ctx.moveTo(r.x,r.y);ctx.lineTo(r.x-4,r.y+12);ctx.stroke()});
for(let i=lightning.length-1;i>=0;i--){let l=lightning[i];if(!paused)l.life-=speed;if(l.life<0)lightning.splice(i,1)}ctx.strokeStyle='#fff9a8';ctx.lineWidth=3;for(let l of lightning){let p=proj(l.x,l.z,map[l.x][l.z].h);ctx.beginPath();ctx.moveTo(p.sX,0);ctx.lineTo(p.sX-8,p.sY*.35);ctx.lineTo(p.sX+5,p.sY*.7);ctx.lineTo(p.sX,p.sY);ctx.stroke()}
document.getElementById('year').textContent='Year '+Math.floor(year);let humans=creatures.filter(v=>v.kind==='human').length;document.getElementById('pop').textContent='Population: '+creatures.length+' • '+humans+' humans';let era=year<20?'Stone Age':year<45?'Bronze Age':year<80?'Middle Ages':'Golden Age';document.getElementById('era').textContent=era;drawMini();requestAnimationFrame(draw)}
function drawMini(){mx.clearRect(0,0,276,276);mx.fillStyle='#397ba1';mx.fillRect(0,0,276,276);for(let x=0;x<N;x+=2)for(let z=0;z<N;z+=2){let t=map[x][z];mx.fillStyle=t.biome==='water'?'#397ba1':t.biome==='sand'?'#d8c17b':t.biome==='mountain'?'#898f8a':'#70a34c';mx.fillRect(x*4.3,z*4.3,5,5)}mx.fillStyle='#fff';for(let c of creatures){mx.beginPath();mx.arc(c.x*4.3,c.z*4.3,1.7,0,7);mx.fill()}let corners=[[0,0],[W,0],[W,H],[0,H]].map(v=>worldPos(v[0],v[1]));mx.beginPath();corners.forEach((v,i)=>i?mx.lineTo(v.x*4.3,v.z*4.3):mx.moveTo(v.x*4.3,v.z*4.3));mx.closePath();mx.strokeStyle='#fff';mx.lineWidth=2;mx.stroke()}mini.addEventListener('pointerdown',e=>{let r=mini.getBoundingClientRect(),x=Math.max(0,Math.min(N-1,((e.clientX-r.left)/r.width)*N)),z=Math.max(0,Math.min(N-1,((e.clientY-r.top)/r.height)*N));camera.x=-(x-z)*TS*.95*camera.zoom;camera.y=-(x+z-N)*TS*.48*camera.zoom});
function hint(s){let h=document.getElementById('hint');h.textContent=s;h.classList.add('show');clearTimeout(h.t);h.t=setTimeout(()=>h.classList.remove('show'),1200)}
let drag=null,lastInfo=null;function inspectAt(p){if(p.x<0||p.z<0||p.x>=N||p.z>=N)return;let t=map[p.x][p.z],near=creatures.find(v=>Math.abs(v.x-p.x)<1.2&&Math.abs(v.z-p.z)<1.2),panel=document.getElementById('panel');panel.classList.add('show');panel.innerHTML=near?`<h3>${near.name} — ${near.kind==='human'?'Human':'Sheep'}</h3><div class="trait"><span>Health</span><b>${Math.round(near.health)}%</b></div><div class="bar"><i style="width:${near.health}%"></i></div><div class="trait"><span>Hunger</span><b>${Math.round(near.hunger||0)}%</b></div><div class="bar"><i style="width:${near.hunger||0}%;background:#e2a84e"></i></div><div class="trait"><span>Age</span><b>${Math.floor(near.age)}</b></div><div class="trait"><span>Biome</span><b>${t.biome}</b></div>`:`<h3>${t.biome.toUpperCase()} TILE</h3><div class="trait"><span>Elevation</span><b>${t.h}</b></div><div class="trait"><span>Life</span><b>${t.tree?'Forest':t.house?'House':t.fire?'Burning':'Natural'}</b></div><div class="bar"><i style="width:${Math.max(5,(t.h+2)*11)}%"></i></div>`;clearTimeout(lastInfo);lastInfo=setTimeout(()=>panel.classList.remove('show'),4000)}
c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,startX:e.clientX,startY:e.clientY,moved:false};if(tool!=='inspect'){let p=worldPos(e.clientX,e.clientY);applyTool(p.x,p.z);lastPaint=p.x+','+p.z}});c.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(e.clientX-drag.startX)+Math.abs(e.clientY-drag.startY)>4)drag.moved=true;if(tool==='inspect'){camera.x+=dx;camera.y+=dy}else{let p=worldPos(e.clientX,e.clientY),key=p.x+','+p.z;if(key!==lastPaint){applyTool(p.x,p.z);lastPaint=key}}drag.x=e.clientX;drag.y=e.clientY});c.addEventListener('pointerup',e=>{if(drag&&!drag.moved&&tool==='inspect')inspectAt(worldPos(e.clientX,e.clientY));drag=null;lastPaint=''});c.addEventListener('pointercancel',()=>{drag=null;lastPaint=''});
c.addEventListener('wheel',e=>{let old=camera.zoom,next=Math.max(.34,Math.min(2,old-e.deltaY*.001)),ratio=next/old,ox=e.clientX-W*.5,oy=e.clientY-H*.5;camera.x=ox-(ox-camera.x)*ratio;camera.y=oy-(oy-camera.y)*ratio;camera.zoom=next},{passive:true});
function applyTool(x,z){if(x<0||z<0||x>=N||z>=N)return;let t=map[x][z];if(tool==='grass'){t.biome='grass';t.h=Math.max(1,t.h);t.fire=0}if(tool==='sand'){t.biome='sand';t.h=1;t.tree=false;t.house=false}if(tool==='water'){t.biome='water';t.h=0;t.tree=false;t.house=false}if(tool==='mountain'){t.biome='mountain';t.h=Math.min(8,t.h+2);t.tree=false;t.house=false}if(tool==='forest')if(t.biome==='grass'||t.biome==='mountain')t.tree=true;if(tool==='house'){t.house=true;t.biome='grass'}if(tool==='human'||tool==='sheep')creatures.push({x:x+.5,z:z+.5,tx:x+.5,tz:z+.5,kind:tool,phase:0,age:0,health:100,hunger:40,name:['Aro','Bala','Milo','Iva','Toru','Sela','Yona','Oro'][creatures.length%8]});if(tool==='rain'){for(let i=0;i<300;i++)rain.push({x:Math.random()*W,y:Math.random()*H-260,life:160+Math.random()*180});hint('A storm rolls across Arcadia')}if(tool==='fire'){t.fire=160;particles.push({})}if(tool==='lightning'){t.h=Math.max(0,t.h-1);t.tree=false;t.house=false;t.fire=100;lightning.push({x,z,life:12});hint('KRA-BOOM!')}if(tool==='erase'){t.tree=false;t.house=false;t.fire=0;for(let i=creatures.length-1;i>=0;i--)if(Math.abs(creatures[i].x-x)<1.5&&Math.abs(creatures[i].z-z)<1.5)creatures.splice(i,1)}if(tool!=='rain')hint(tool==='inspect'?'Inspect mode':tool.toUpperCase()+' cast')}
document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>{document.querySelector('.tool.active')?.classList.remove('active');b.classList.add('active');tool=b.dataset.tool;hint(b.dataset.tip)});document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'▶':'Ⅱ'};document.getElementById('speed').onclick=()=>{speed=speed===1?2:speed===2?4:1;document.getElementById('speed').textContent=speed+'×'};draw();
</script></body></html>
