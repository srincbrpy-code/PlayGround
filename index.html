<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WorldBox — God Sandbox</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#82b8e8;font-family:Trebuchet MS,Arial,sans-serif;touch-action:none;user-select:none}canvas{display:block;width:100%;height:100%;image-rendering:auto}
#top{position:absolute;left:14px;top:12px;display:flex;gap:8px}.pill{height:38px;padding:0 13px;border-radius:7px;background:rgba(38,45,54,.78);color:#fff;display:flex;align-items:center;font-weight:800;font-size:14px;border:1px solid rgba(255,255,255,.18);box-shadow:0 4px 12px #0003}.pill b{color:#7de2ff;margin-right:5px}
#toolbar{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:6px;padding:7px;border-radius:10px;background:rgba(31,39,48,.88);box-shadow:0 6px 20px #0004;max-width:calc(100% - 24px)}
.tool{width:58px;height:58px;border:2px solid transparent;border-radius:8px;background:#4b5964;color:white;display:grid;place-items:center;cursor:pointer;position:relative;transition:.12s}.tool:hover{background:#637684}.tool.active{border-color:#fff09a;background:#697e4a;transform:translateY(-3px)}.tool .emoji{font-size:28px}.tool .label{position:absolute;bottom:-18px;color:white;font-size:10px;text-shadow:1px 2px 2px #000;font-weight:bold;white-space:nowrap}.tool[data-tip]:hover:after{content:attr(data-tip);position:absolute;bottom:72px;background:#263038;color:#fff;padding:7px 9px;border-radius:5px;font-size:12px;white-space:nowrap}
#stats{position:absolute;right:12px;top:12px;text-align:right;color:white;text-shadow:0 2px 3px #18222a}.year{font-size:18px;font-weight:bold}.pop{font-size:12px;opacity:.9}
#pause{position:absolute;right:12px;top:58px;width:38px;height:38px;border:0;border-radius:7px;background:#263038;color:white;font-size:17px;cursor:pointer}
#hint{position:absolute;left:50%;top:16px;transform:translateX(-50%);background:#263038cc;color:white;padding:8px 12px;border-radius:6px;font-size:12px;opacity:0;transition:.25s}#hint.show{opacity:1}
#info{position:absolute;left:14px;bottom:90px;display:none;width:190px;background:#263038df;border-radius:8px;color:white;padding:10px;font-size:12px}.bar{height:5px;background:#13191d;border-radius:4px;margin-top:5px}.bar i{display:block;height:100%;background:#70c66b;border-radius:4px}
@media(max-width:700px){.tool{width:46px;height:46px}.tool .emoji{font-size:22px}.pill:nth-child(2){display:none}#info{display:none!important}.year{font-size:14px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top"><div class="pill"><b>◉</b><span id="realm">GREENLAND</span></div><div class="pill">Era <b id="era">Stone Age</b></div></div>
<div id="stats"><div class="year" id="year">Year 1</div><div class="pop" id="pop">Population: 12</div></div><button id="pause">Ⅱ</button>
<div id="hint"></div><div id="info"></div>
<div id="toolbar">
<button class="tool active" data-tool="inspect" data-tip="Inspect"><span class="emoji">🔎</span><span class="label">Inspect</span></button>
<button class="tool" data-tool="grass" data-tip="Grow grass"><span class="emoji">🌿</span><span class="label">Grass</span></button>
<button class="tool" data-tool="forest" data-tip="Plant forest"><span class="emoji">🌲</span><span class="label">Forest</span></button>
<button class="tool" data-tool="house" data-tip="Create house"><span class="emoji">🏠</span><span class="label">House</span></button>
<button class="tool" data-tool="human" data-tip="Spawn human"><span class="emoji">🧍</span><span class="label">Human</span></button>
<button class="tool" data-tool="sheep" data-tip="Spawn sheep"><span class="emoji">🐑</span><span class="label">Sheep</span></button>
<button class="tool" data-tool="rain" data-tip="Call rain"><span class="emoji">🌧️</span><span class="label">Rain</span></button>
<button class="tool" data-tool="fire" data-tip="Start fire"><span class="emoji">🔥</span><span class="label">Fire</span></button>
<button class="tool" data-tool="lightning" data-tip="Strike lightning"><span class="emoji">⚡</span><span class="label">Lightning</span></button>
<button class="tool" data-tool="erase" data-tip="Erase life"><span class="emoji">🗑️</span><span class="label">Erase</span></button>
</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const N=32,TS=24;let map=[],camera={x:0,y:0,zoom:1},tool='inspect',paused=false,year=1,rain=[],smoke=[];
for(let x=0;x<N;x++){map[x]=[];for(let z=0;z<N;z++){let d=Math.hypot(x-15,z-16);let h=Math.floor(1+Math.max(0,5-d*.22)+Math.sin(x*.7)*Math.sin(z*.5));map[x][z]={h,biome:d>13?'sand':h>5?'rock':'grass',tree:false,house:false,fire:false}}}
function clear(){ctx.fillStyle='#82b8df';ctx.fillRect(0,0,W,H);ctx.fillStyle='#aad3ef';ctx.beginPath();ctx.moveTo(0,H*.4);ctx.quadraticCurveTo(W*.3,H*.25,W*.65,H*.42);ctx.quadraticCurveTo(W*.85,H*.5,W,H*.38);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill()}
function project(x,z,h){let cx=W*.5+camera.x, cy=H*.43+camera.y;return{sx:cx+(x-z)*TS*.95*camera.zoom,sy:cy+(x+z)*TS*.48*camera.zoom-h*13*camera.zoom}}
function poly(a,b,c,d,color){ctx.beginPath();ctx.moveTo(a.sx,a.sy);ctx.lineTo(b.sx,b.sy);ctx.lineTo(c.sx,c.sy);ctx.lineTo(d.sx,d.sy);ctx.closePath();ctx.fillStyle=color;ctx.fill();ctx.strokeStyle='#0001';ctx.stroke()}
function cuboid(x,z,h,top,left,right){let p=project(x,z,h),a=project(x+1,z,h),b=project(x+1,z+1,h),d=project(x,z+1,h),q=project(x,z,h-1),aq=project(x+1,z,h-1),bq=project(x+1,z+1,h-1),dq=project(x,z+1,h-1);poly(q,dq,bq,aq,left);poly(aq,bq,b,project(x+1,z,h),right);poly(p,a,b,d,top)}
function worldPos(mx,my){let cx=W*.5+camera.x,cy=H*.43+camera.y;let u=(mx-cx)/(TS*.95*camera.zoom),v=(my-cy)/(TS*.48*camera.zoom);return{x:Math.floor((u+v)/2),z:Math.floor((v-u)/2)}}
const colors={grass:'#78ad4a',sand:'#d8c173',rock:'#777d76'};
function drawTile(x,z){let t=map[x][z],p=project(x,z,t.h),a=project(x+1,z,t.h),b=project(x+1,z+1,t.h),d=project(x,z+1,t.h);poly(p,a,b,d,t.biome==='grass'?colors.grass:t.biome==='sand'?colors.sand:'#777e78');let left=project(x,z+1,t.h),left2=project(x,z+1,t.h-1),right=project(x+1,z+1,t.h),right2=project(x+1,z+1,t.h-1);poly(left,left2,right2,right,t.biome==='sand'?'#b99e58':'#587b43');
 if(t.tree)drawTree(x,z,t.h);if(t.house)drawHouse(x,z,t.h);if(t.fire)drawFire(x,z,t.h)}
function drawTree(x,z,h){let p=project(x+.5,z+.5,h);ctx.fillStyle='#795238';ctx.fillRect(p.sx-3,p.sy-18,6,18);ctx.fillStyle='#3f7f3a';ctx.beginPath();ctx.moveTo(p.sx,p.sy-42);ctx.lineTo(p.sx-15,p.sy-10);ctx.lineTo(p.sx+15,p.sy-10);ctx.fill();ctx.fillStyle='#58a84d';ctx.beginPath();ctx.moveTo(p.sx,p.sy-34);ctx.lineTo(p.sx-11,p.sy-6);ctx.lineTo(p.sx+11,p.sy-6);ctx.fill()}
function drawHouse(x,z,h){let p=project(x+.5,z+.5,h);ctx.fillStyle='#9b7653';ctx.fillRect(p.sx-17,p.sy-29,34,29);ctx.fillStyle='#c2a169';ctx.fillRect(p.sx-12,p.sy-22,8,10);ctx.fillStyle='#5b3d2d';ctx.fillRect(p.sx+5,p.sy-14,7,14);ctx.fillStyle='#733f32';ctx.beginPath();ctx.moveTo(p.sx-22,p.sy-29);ctx.lineTo(p.sx,p.sy-48);ctx.lineTo(p.sx+22,p.sy-29);ctx.fill()}
function drawFire(x,z,h){let p=project(x+.5,z+.5,h);ctx.fillStyle='#e84d32';ctx.beginPath();ctx.moveTo(p.sx,p.sy-30);ctx.lineTo(p.sx-10,p.sy);ctx.lineTo(p.sx+10,p.sy);ctx.fill();ctx.fillStyle='#ffc13b';ctx.beginPath();ctx.moveTo(p.sx,p.sy-22);ctx.lineTo(p.sx-5,p.sy-2);ctx.lineTo(p.sx+5,p.sy-2);ctx.fill()}
let creatures=[];
for(let i=0;i<12;i++)creatures.push({x:12+(i%4),z:13+Math.floor(i/4),kind:i%5===0?'sheep':'human',tx:0,tz:0,phase:Math.random()*6});
function drawCreature(a){let t=map[Math.floor(a.x)]?.[Math.floor(a.z)],h=t?t.h:1,p=project(a.x+.5,a.z+.5,h);if(a.kind==='sheep'){ctx.fillStyle='#f2efe1';ctx.beginPath();ctx.ellipse(p.sx,p.sy-12,9,7,0,0,7);ctx.fill();ctx.fillStyle='#4a3d36';ctx.beginPath();ctx.arc(p.sx+7,p.sy-12,4,0,7);ctx.fill()}else{ctx.fillStyle='#4e9c83';ctx.fillRect(p.sx-5,p.sy-23,10,18);ctx.fillStyle='#c99268';ctx.fillRect(p.sx-4,p.sy-31,8,8);ctx.fillStyle='#3d3028';ctx.fillRect(p.sx-5,p.sy-32,10,3);ctx.fillStyle='#382b24';ctx.fillRect(p.sx-4,p.sy-5,3,7);ctx.fillRect(p.sx+1,p.sy-5,3,7)} }
function update(){if(!paused){year+=.002;for(const c of creatures){if(!Math.random()>.992)continue;c.tx=c.x+(Math.random()*2-1)*4;c.tz=c.z+(Math.random()*2-1)*4;c.tx=Math.max(2,Math.min(N-3,c.tx));c.tz=Math.max(2,Math.min(N-3,c.tz))}for(const c of creatures){c.x+=(c.tx-c.x||.02)*.003;c.z+=(c.tz-c.z||.02)*.003}for(const r of rain){r.y+=5;r.life--}for(let i=rain.length-1;i>=0;i--)if(rain[i].life<=0||rain[i].y>H)rain.splice(i,1)}}
function drawRain(){ctx.strokeStyle='#d8edff99';ctx.lineWidth=1;for(const r of rain){ctx.beginPath();ctx.moveTo(r.x,r.y);ctx.lineTo(r.x-4,r.y+12);ctx.stroke()}}
function draw(){clear();update();let tiles=[];for(let s=0;s<N*2;s++)for(let x=0;x<N;x++){let z=s-x;if(z>=0&&z<N)tiles.push([x,z])}tiles.sort((a,b)=>(a[0]+a[1])-(b[0]+b[1])).forEach(v=>drawTile(v[0],v[1]));creatures.forEach(drawCreature);drawRain();document.getElementById('year').textContent='Year '+Math.floor(year);document.getElementById('pop').textContent='Population: '+(creatures.filter(c=>c.kind==='human').length)+' humans';requestAnimationFrame(draw)}
function hint(s){let h=document.getElementById('hint');h.textContent=s;h.classList.add('show');clearTimeout(h.t);h.t=setTimeout(()=>h.classList.remove('show'),1000)}
canvas.addEventListener('pointerdown',e=>{let p=worldPos(e.clientX,e.clientY);if(p.x<0||p.z<0||p.x>=N||p.z>=N)return;let t=map[p.x][p.z];if(tool==='inspect'){let info=document.getElementById('info');info.style.display='block';info.innerHTML='<b>'+t.biome.toUpperCase()+' TILE</b><br>Height: '+t.h+(t.tree?' <br>Forest present':'')+(t.house?' <br>Village house':'')+'<div class="bar"><i style="width:'+(t.h*12)+'%"></i></div>';setTimeout(()=>info.style.display='none',3500);return}if(tool==='grass'){t.biome='grass';t.h=Math.max(t.h,1)}if(tool==='forest')t.tree=true;if(tool==='house')t.house=true;if(tool==='human'||tool==='sheep')creatures.push({x:p.x+.5,z:p.z+.5,kind:tool,tx:p.x+.5,tz:p.z+.5,phase:0});if(tool==='rain'){for(let i=0;i<90;i++)rain.push({x:Math.random()*W,y:Math.random()*H-200,life:180+Math.random()*100})}if(tool==='fire')t.fire=!t.fire;if(tool==='lightning'){t.h=Math.max(0,t.h-1);t.tree=false;t.house=false;t.fire=true;hint('Lightning strikes!')}if(tool==='erase'){t.tree=false;t.house=false;t.fire=false;for(let i=creatures.length-1;i>=0;i--)if(Math.abs(creatures[i].x-p.x)<1.5&&Math.abs(creatures[i].z-p.z)<1.5)creatures.splice(i,1)}hint(tool.toUpperCase()+' applied')});
document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>{document.querySelector('.active')?.classList.remove('active');b.classList.add('active');tool=b.dataset.tool;hint(b.dataset.tip)});
document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'▶':'Ⅱ'};
let drag=null;canvas.addEventListener('pointermove',e=>{if(drag){camera.x+=e.clientX-drag.x;camera.y+=e.clientY-drag.y;drag={x:e.clientX,y:e.clientY}}});canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY}});addEventListener('pointerup',()=>drag=null);canvas.addEventListener('wheel',e=>{camera.zoom=Math.max(.65,Math.min(1.8,camera.zoom-e.deltaY*.001))},{passive:true});draw();
</script>
</body>
</html>
