<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0a0a0d" />
    <meta name="description" content="POWER — a minimalist 2D stickman duel. One line, no mercy." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230a0a0d'/%3E%3Ctext x='50' y='73' font-size='70' font-family='Arial,sans-serif' font-weight='900' fill='%23f4f1e8' text-anchor='middle'%3EP%3C/text%3E%3Crect x='69' y='67' width='15' height='15' fill='%23ff3b30'/%3E%3C/svg%3E"
    />
    <title>POWER — A Stickman Duel</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="game">
      <canvas id="stage" aria-label="A one-dimensional stickman duel. You fight a rival on a single line."></canvas>
      <div class="vignette" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>

      <header class="hud hidden" id="hud" aria-label="Match status">
        <div class="hud-side you">
          <div class="hud-top">
            <span class="who">YOU</span>
            <span class="pips" id="pips-you" aria-label="Rounds won"><i></i><i></i></span>
          </div>
          <div class="hp" id="hp-you-wrap"><i id="hp-you"></i></div>
          <div class="meter" id="pwr-you-wrap">
            <i id="pwr-you"></i>
            <span class="meter-label" id="pwr-you-label">POWER</span>
          </div>
        </div>

        <div class="hud-center">
          <span id="round-label">DUEL 01</span>
          <span class="vs">VS</span>
          <button id="mute" type="button" aria-label="Toggle sound" aria-pressed="false">SFX ON</button>
        </div>

        <div class="hud-side rival">
          <div class="hud-top">
            <span class="pips" id="pips-rival" aria-label="Rival rounds won"><i></i><i></i></span>
            <span class="who">RIVAL</span>
          </div>
          <div class="hp" id="hp-rival-wrap"><i id="hp-rival"></i></div>
          <div class="meter" id="pwr-rival-wrap">
            <i id="pwr-rival"></i>
            <span class="meter-label" id="pwr-rival-label">POWER</span>
          </div>
        </div>
      </header>

      <div class="combo" id="combo" aria-live="polite"></div>
      <div class="banner" id="banner" aria-live="assertive">
        <span class="banner-main" id="banner-main"></span>
        <span class="banner-sub" id="banner-sub"></span>
      </div>

      <div class="touch" id="touch">
        <div class="stick" id="stick">
          <div class="stick-ring"></div>
          <div class="stick-knob" id="knob"></div>
        </div>
        <div class="actions">
          <button class="tbtn power" type="button" data-act="power" aria-label="Activate power">POWER</button>
          <button class="tbtn" type="button" data-act="guard" aria-label="Guard">GUARD</button>
          <button class="tbtn" type="button" data-act="jump" aria-label="Jump">JUMP</button>
          <button class="tbtn strike" type="button" data-act="strike" aria-label="Strike">STRIKE</button>
          <button class="tbtn" type="button" data-act="heavy" aria-label="Heavy strike">HEAVY</button>
        </div>
      </div>

      <section class="screen title-screen" id="title">
        <div class="title-inner">
          <div class="title-top">
            <div class="eyebrow"><span class="dot"></span> A MINIMAL DUEL <span class="sep">/</span> <span class="hard">HARD</span></div>
          </div>

          <div class="title-mid">
            <h1 class="logo">POWER<span class="logo-dot">.</span></h1>
            <p class="tagline">Two stickmen. One line.<br />No mercy.</p>
          </div>

          <div class="title-bottom">
            <div class="title-actions">
              <button id="start" class="cta" type="button" aria-label="Start game">
                <span>ENTER THE RING</span>
                <span class="cta-arrow" aria-hidden="true">→</span>
              </button>
              <span class="press-hint">PRESS ENTER / TAP</span>
            </div>

            <div class="control-card" aria-label="Controls">
              <div class="control-row keyboard-hint"><kbd>A</kbd><kbd>D</kbd><span>MOVE</span></div>
              <div class="control-row keyboard-hint"><kbd>W</kbd><span>JUMP</span></div>
              <div class="control-row keyboard-hint"><kbd>J</kbd><span>STRIKE</span></div>
              <div class="control-row keyboard-hint"><kbd>K</kbd><span>HEAVY</span></div>
              <div class="control-row keyboard-hint"><kbd>L</kbd><span>GUARD</span></div>
              <div class="control-row keyboard-hint"><kbd>Q</kbd><span>POWER</span></div>
              <div class="control-row keyboard-hint"><kbd>⇧</kbd><span>DASH</span></div>
              <div class="control-row touch-hint"><span>STICK TO MOVE · TAP TWICE TO DASH</span></div>
              <div class="control-tip"><span class="tip-key">TIP</span> TAP GUARD ON IMPACT TO PARRY</div>
            </div>
          </div>
        </div>
      </section>

      <section class="screen result-screen hidden" id="result">
        <div class="result-inner">
          <div class="eyebrow" id="result-eyebrow">DUEL COMPLETE</div>
          <h1 class="result-title" id="result-title">VICTORY</h1>
          <p class="result-sub" id="result-sub">The line is yours.</p>
          <div class="stats" id="stats"></div>
          <button id="rematch" class="cta" type="button">
            <span>REMATCH</span>
            <span class="cta-arrow" aria-hidden="true">↻</span>
          </button>
          <span class="press-hint">PRESS R TO RUN IT BACK</span>
        </div>
      </section>
    </main>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
